<body class="bg-background text-on-background font-body-md min-h-screen pb-xl">
<!-- Top Navigation Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 bg-surface-container-low transition-colors duration-200">
<div class="flex items-center gap-md">
<button class="p-sm hover:bg-surface-variant rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<h1 class="text-title-lg font-title-lg font-bold text-primary">Thêm giao dịch</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
</header>
<main class="mt-20 px-margin-mobile max-w-2xl mx-auto">
<!-- Income/Expense Toggle -->
<div class="flex bg-surface-container-high rounded-full p-xs mb-lg">
<button class="flex-1 py-md rounded-full text-center font-title-lg text-body-lg bg-surface-container-lowest shadow-sm text-on-surface-variant transition-all duration-200">
                Chi tiêu
            </button>
<button class="flex-1 py-md rounded-full text-center font-title-lg text-body-lg text-on-surface-variant hover:bg-surface-variant transition-all duration-200">
                Thu nhập
            </button>
</div>
<!-- Amount Input Section -->
<div class="mb-xl text-center">
<label class="block text-label-sm font-label-sm text-outline mb-xs">Số tiền giao dịch</label>
<div class="flex items-center justify-center gap-sm">
<input class="bg-transparent border-none text-display-lg font-display-lg text-primary w-full text-center focus:ring-0" placeholder="0" type="text" value="0"/>
<span class="text-headline-md font-headline-md text-primary">₫</span>
</div>
<div class="h-0.5 w-full bg-primary-container opacity-20 mt-xs rounded-full"></div>
</div>
<!-- Category Grid Section -->
<section class="mb-xl">
<div class="flex items-center justify-between mb-md">
<h3 class="font-title-lg text-title-lg text-on-surface">Hạng mục</h3>
<button class="text-primary font-label-sm text-label-sm hover:underline">Xem tất cả</button>
</div>
<div class="grid grid-cols-4 gap-gutter">
<!-- Category Item -->
<button class="flex flex-col items-center gap-xs p-xs hover:bg-secondary-container rounded-xl transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined text-headline-md">restaurant</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Ăn uống</span>
</button>
<button class="flex flex-col items-center gap-xs p-xs hover:bg-secondary-container rounded-xl transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined text-headline-md">shopping_cart</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Mua sắm</span>
</button>
<button class="flex flex-col items-center gap-xs p-xs hover:bg-secondary-container rounded-xl transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined text-headline-md">directions_car</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Di chuyển</span>
</button>
<button class="flex flex-col items-center gap-xs p-xs hover:bg-secondary-container rounded-xl transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined text-headline-md">home</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Nhà cửa</span>
</button>
<button class="flex flex-col items-center gap-xs p-xs hover:bg-secondary-container rounded-xl transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined text-headline-md">receipt</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Hóa đơn</span>
</button>
<button class="flex flex-col items-center gap-xs p-xs hover:bg-secondary-container rounded-xl transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined text-headline-md">favorite</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Sức khỏe</span>
</button>
<button class="flex flex-col items-center gap-xs p-xs hover:bg-secondary-container rounded-xl transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined text-headline-md">school</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Giáo dục</span>
</button>
<button class="flex flex-col items-center gap-xs p-xs hover:bg-secondary-container rounded-xl transition-colors group">
<div class="w-14 h-14 rounded-full bg-surface-container-highest flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined text-headline-md">more_horiz</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Khác</span>
</button>
</div>
</section>
<!-- Form Fields -->
<div class="space-y-lg">
<!-- Date Picker Placeholder -->
<div class="flex items-center gap-md p-md bg-surface-container rounded-xl border border-transparent hover:border-outline-variant cursor-pointer transition-all">
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
<div class="flex-1">
<p class="text-label-sm font-label-sm text-outline">Ngày giao dịch</p>
<p class="text-body-lg font-body-lg text-on-surface">Hôm nay, 24 Tháng 5, 2024</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">expand_more</span>
</div>
<!-- Note Text Field -->
<div class="flex items-start gap-md p-md bg-surface-container rounded-xl border border-transparent focus-within:border-primary transition-all">
<span class="material-symbols-outlined text-on-surface-variant mt-xs">notes</span>
<div class="flex-1">
<p class="text-label-sm font-label-sm text-outline">Ghi chú</p>
<textarea class="w-full bg-transparent border-none p-0 text-body-lg font-body-lg text-on-surface placeholder:text-outline-variant focus:ring-0" placeholder="Nhập ghi chú cho giao dịch này..." rows="2"></textarea>
</div>
</div>
<!-- Wallet Selector -->
<div class="flex items-center gap-md p-md bg-surface-container rounded-xl border border-transparent hover:border-outline-variant cursor-pointer transition-all">
<span class="material-symbols-outlined text-on-surface-variant">account_balance_wallet</span>
<div class="flex-1">
<p class="text-label-sm font-label-sm text-outline">Từ ví</p>
<p class="text-body-lg font-body-lg text-on-surface">Ví Tiền mặt</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
</div>

</div>
<!-- Submit Button -->
<div class="mt-xl">
<button class="w-full py-lg bg-primary text-on-primary rounded-full font-title-lg text-body-lg shadow-lg hover:bg-surface-tint active:scale-95 transition-all duration-150 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Lưu giao dịch
            </button>
</div>
</main>
